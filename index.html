<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banana Hunter - Amazonie</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    
    <main class="jeu-container">
        
      
        <div class="titre-zone">

            <h1 class="titre-principal">
                <span class="titre-mot">Banana</span>
                <span class="titre-mot amazonie">Hunter</span>
            </h1>
           
            <a href="../../index.html" class="bouton-retour">Retour</a>
        </div>


        <div class="zone-canvas">
            <canvas id="canvas" width="800" height="600"></canvas>
        </div>

        
        <div class="info-panel">

            <div class="info-item">
                <img src="./assets/banana.png" alt="banane" class="info-icon">
                <span>Banane jaune : 50 pts</span>
            </div>

            <div class="info-item">
                <img src="./assets/green-banana.png" alt="banane verte" class="info-icon">
                <span>Banane verte : 100 pts</span>
            </div>

            <div class="info-item">
                <img src="./assets/ape.png" alt="singe" class="info-icon">
                <span>Singe : 500 pts</span>
            </div>
            
        </div>

        <p class="controls">
            <strong>ESPACE</strong> Démarrer · <strong>Clic</strong> Attraper · <strong>ESC</strong> Scores
        </p>
        
    </main>

    <footer class="footer-credits">
        <p>
            Icônes : 
            <a href="https://www.flaticon.com" target="_blank">Flaticon</a>
            (Sophia tkx, Park Jisun, max.icons)
        </p>
    </footer>

    <script type="module" src="./js/script.js"></script>
</body>
</html>
